# nginx du wiki Farmling : compression, cache, en-têtes de sécurité et 404 aux couleurs du jeu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/live;   # « live » : lien vers la dernière version construite
    index index.html;
    absolute_redirect off;      # /wiki -> /wiki/ sans casser l'hôte derrière un proxy
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/html text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    # Sprites et captures : ils changent rarement (30 jours)
    location ~* \.(png|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Code de l'éditeur et index de recherche (1 jour)
    location ~* \.(js|json)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }
}
